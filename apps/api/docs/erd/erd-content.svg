><rect width="320" height="80" fill="#f4f4f4" /><rect width="320" height="46" fill="#7d9bbd" /><text x="18" y="31" font-size="22" font-weight="600" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">User</text><text x="18" y="69" font-size="17" fill="#222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">_id</text><text x="304" y="69" font-size="15" fill="#7b8088" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ObjectId</text></g><text x="50" y="818" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Lines run from a field to the table it points at.  1 = one, * = many.  Lighter tables are shown in full in another diagram.</text><text x="50" y="842" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Every version of a piece of content shares the same rootId (the first version). previousVersion points at the version it was made from.</text><text x="50" y="866" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Content.competencies is a list of ids: many content items can train many competencies.</text><text x="50" y="890" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A StoryMission links one story to its mission and holds the outcomes, vocabulary and a decision challenge (no correct answer).</text></svg>