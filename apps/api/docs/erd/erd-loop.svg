ont-size="17" fill="#222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">_id</text><text x="304" y="69" font-size="15" fill="#7b8088" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ObjectId</text></g><g transform="translate(50,220)"><rect width="320" height="80" fill="#f4f4f4" /><rect width="320" height="46" fill="#7d9bbd" /><text x="18" y="31" font-size="22" font-weight="600" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Content</text><text x="18" y="69" font-size="17" fill="#222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">_id</text><text x="304" y="69" font-size="15" fill="#7b8088" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ObjectId</text></g><g transform="translate(50,360)"><rect width="320" height="80" fill="#f4f4f4" /><rect width="320" height="46" fill="#7d9bbd" /><text x="18" y="31" font-size="22" font-weight="600" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Progress</text><text x="18" y="69" font-size="17" fill="#222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">_id</text><text x="304" y="69" font-size="15" fill="#7b8088" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ObjectId</text></g><text x="50" y="786" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Lines run from a field to the table it points at.  1 = one, * = many.  Lighter tables are shown in full in another diagram.</text><text x="50" y="810" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A completed lesson (Progress) triggers one mission. A mission has at most one observation and one reflection.</text><text x="50" y="834" font-size="15" fill="#6b7078" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">An observation of independent or reminder becomes an EvidenceEvent. Every table here also has familyId (not drawn).</text></svg>