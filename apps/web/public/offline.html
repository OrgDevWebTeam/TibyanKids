<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال · No connection</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 2rem;
        padding: 1.5rem;
        /* Core / Background and Text primary from the design system. */
        background: #fbf8f3;
        color: #2a2420;
      }
      section {
        max-width: 28rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Shown by the service worker when a page cannot load. Holds no personal data. -->
    <section lang="ar" dir="rtl">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تأكّد من الاتصال، ثم حاول مرة أخرى.</p>
      <a href="/">حاول مرة أخرى</a>
    </section>
    <section lang="en" dir="ltr">
      <h1>You are offline</h1>
      <p>Check your connection, then try again.</p>
      <a href="/">Try again</a>
    </section>
    <script>
      // Show the visitor's language only. The address bar still holds the page that failed to
      // load, so its first segment (/ar or /en) gives the language; otherwise the choice saved by
      // the language switcher. When neither is known, or scripts are off, both stay visible.
      (function () {
        var first = location.pathname.split("/")[1];
        var saved = null;
        try {
          saved = localStorage.getItem("noor.locale");
        } catch (error) {
          // Storage can be blocked; the path is enough.
        }
        var locale = first === "ar" || first === "en" ? first : saved;
        if (locale !== "ar" && locale !== "en") return;

        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
        var sections = document.querySelectorAll("section[lang]");
        for (var i = 0; i < sections.length; i++) {
          var section = sections[i];
          if (section.lang === locale) {
            document.title = section.querySelector("h1").textContent;
            // "Try again" reloads the page that failed, not the home page.
            section.querySelector("a").href = location.href;
          } else {
            section.hidden = true;
          }
        }
      })();
    </script>
  </body>
</html>
